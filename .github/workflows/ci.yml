name: Django CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction -v

      - name: Run flake8
        run: poetry run flake8

  tests:
    needs: lint
    runs-on: ubuntu-latest
    env:
      DJANGO_TEST: "1"

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Install dependencies
        run: poetry install --no-interaction -v

      - name: Set test database for CI
        run: echo "DJANGO_TEST=1" >> $GITHUB_ENV

      - name: Run migrations
        run: poetry run python manage.py migrate

      - name: Run tests
        run: poetry run python manage.py test --verbosity=2

  build:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/learnspace:${{ github.sha }} .

      - name: Push Docker image to Docker Hub
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/learnspace:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy files via rsync
        run: rsync -avz -e "ssh -o StrictHostKeyChecking=no" --include='docker-compose.yml' --include='Dockerfile' --include='server/' --include='server/***' --include='.env' --exclude='*' ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }}:/home/andrs/learnspace/

      - name: Start services
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            echo "📁 Checking files on server..."
            cd /home/andrs/learnspace
            pwd
            ls -la
          
            # Если файлов нет - клонируем вручную
            if [ ! -f docker-compose.yml ]; then
              echo "❌ Files not found, cloning from GitHub..."
              cd /home/andrs
              rm -rf learnspace
              git clone -b develop https://github.com/${{ github.repository }}.git learnspace
              cd learnspace
            fi
          
            echo "✅ Files ready, starting services..."
            docker compose down
            docker compose up -d
          EOF
