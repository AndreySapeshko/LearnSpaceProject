services:
  web:
    build: .
    restart: always
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/code/static
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    env_file:
      - ./.env

  db:
    image: postgres:15
    env_file:
      - ./.env
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "${REDIS_PORT:-6379}:6379"

  celery:
    build: .
    command: celery -A config worker -l info --pool=solo
    restart: always
    env_file: .env
    depends_on:
      - redis
      - db
    healthcheck:
      test: [ "CMD", "celery", "inspect", "ping", "-A", "config", "-t", "10" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A config beat -l info
    restart: always
    env_file: .env
    depends_on:
      - redis
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
  static_volume:
